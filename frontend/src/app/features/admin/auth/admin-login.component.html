<div style="min-height:100vh;display:grid;place-items:center;background:var(--canvas);padding:40px 20px">
  <div class="card pad" style="width:100%;max-width:380px;padding:26px">
    <div class="logo" style="margin-bottom:6px;font-weight:700;font-size:16px;letter-spacing:-0.03em">
      Ghumo <em style="font-style:normal;color:var(--accent)">Odisha</em>
    </div>
    <p class="note" style="margin-bottom:22px">Admin panel · staff access only</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="fld">
        <span class="lbl">Username</span>
        <input class="inp" formControlName="username" autocomplete="username" />
      </div>
      <div class="fld">
        <span class="lbl">Password</span>
        <input class="inp" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      <button class="btn block" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spin"></span>
        } @else {
          Sign in
        }
      </button>
    </form>

    @if (errorMessage()) {
      <div class="row" style="margin-top:14px;gap:10px;align-items:flex-start">
        <span style="width:26px;height:26px;border-radius:8px;background:var(--danger-bg);color:var(--danger);display:grid;place-items:center;font-size:12px;flex:0 0 auto">!</span>
        <div class="note">{{ errorMessage() }}</div>
      </div>
    }
  </div>
</div>
